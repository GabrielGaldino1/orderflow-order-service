spring.application.name=order-service
server.port=${HTTP_PORT:8080}

spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/orderflow_orders}
spring.datasource.username=${DB_USERNAME:order_service}
spring.datasource.password=${DB_PASSWORD:order_service_dev}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=when-authorized
management.endpoints.web.exposure.include=health,info
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
