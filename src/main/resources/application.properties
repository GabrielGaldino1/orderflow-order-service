spring.application.name=order-service
server.port=${HTTP_PORT:8080}

spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/orderflow_orders}
spring.datasource.username=${DB_USERNAME:order_service}
spring.datasource.password=${DB_PASSWORD:order_service_dev}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8083/realms/orderflow}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI:http://localhost:8083/realms/orderflow/protocol/openid-connect/certs}
orderflow.security.audience=${OIDC_AUDIENCE:orderflow-api}
orderflow.outbox.inventory-commands-topic=${INVENTORY_COMMANDS_TOPIC:orderflow-inventory-commands}
orderflow.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
orderflow.outbox.poll-interval=${OUTBOX_POLL_INTERVAL:500ms}
orderflow.outbox.claim-timeout=${OUTBOX_CLAIM_TIMEOUT:30s}
orderflow.outbox.send-timeout=${OUTBOX_SEND_TIMEOUT:10s}
orderflow.outbox.scheduling-enabled=${OUTBOX_SCHEDULING_ENABLED:true}

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=when-authorized
management.endpoints.web.exposure.include=health,info,metrics
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
