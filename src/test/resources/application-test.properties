spring.datasource.url=jdbc:h2:mem:orders;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
spring.kafka.bootstrap-servers=localhost:19092
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:18083/realms/orderflow
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:18083/realms/orderflow/protocol/openid-connect/certs
