openapi: 3.1.0
info:
  title: OrderFlow Order API
  version: 1.0.0
paths:
  /api/v1/orders:
    post:
      summary: Create an order idempotently
      operationId: createOrder
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: X-Correlation-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              items:
                - productId: 22222222-2222-4222-8222-222222222221
                  quantity: 2
                - productId: 22222222-2222-4222-8222-222222222222
                  quantity: 1
      responses:
        '201':
          description: Order created, or the result of an equivalent request replayed
          headers:
            Location:
              required: true
              schema:
                type: string
            X-Correlation-Id:
              required: true
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Missing idempotency key or invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Missing or invalid access token
        '403':
          description: Token does not grant the CUSTOMER role
        '409':
          description: Idempotency key reused with different normalized content
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Every nonexistent or inactive product is reported together
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    properties:
                      invalidProductIds:
                        type: array
                        items:
                          type: string
                          format: uuid
  /api/v1/orders/{orderId}:
    get:
      summary: Get the current state and immutable item snapshot of an order
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Order visible to its owner or an operator
          headers:
            X-Correlation-Id:
              required: true
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetails'
        '401':
          description: Missing or invalid access token
        '403':
          description: Token grants neither CUSTOMER nor OPERATOR
        '404':
          description: Order does not exist or is not visible to the authenticated customer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/orders/{orderId}/history:
    get:
      summary: Get the immutable, sequence-ordered transition history of an order
      operationId: getOrderHistory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Ordered transition history visible to the owner or an operator
          headers:
            X-Correlation-Id:
              required: true
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderHistory'
        '401':
          description: Missing or invalid access token
        '403':
          description: Token grants neither CUSTOMER nor OPERATOR
        '404':
          description: Order does not exist or is not visible to the authenticated customer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [productId, quantity]
            properties:
              productId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
                maximum: 10000
    Order:
      type: object
      additionalProperties: false
      required: [orderId, status, currency, totalAmount, createdAt]
      properties:
        orderId:
          type: string
          format: uuid
        status:
          type: string
          const: INVENTORY_PENDING
        currency:
          type: string
          const: BRL
        totalAmount:
          type: number
          multipleOf: 0.01
        createdAt:
          type: string
          format: date-time
    OrderDetails:
      type: object
      additionalProperties: false
      required: [orderId, status, currency, totalAmount, createdAt, items]
      properties:
        orderId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        currency:
          type: string
          const: BRL
        totalAmount:
          type: number
          multipleOf: 0.01
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    OrderItem:
      type: object
      additionalProperties: false
      required: [productId, productName, unitPrice, quantity, lineTotal]
      properties:
        productId:
          type: string
          format: uuid
        productName:
          type: string
        unitPrice:
          type: number
          multipleOf: 0.01
        quantity:
          type: integer
          minimum: 1
        lineTotal:
          type: number
          multipleOf: 0.01
    OrderHistory:
      type: object
      additionalProperties: false
      required: [orderId, transitions]
      properties:
        orderId:
          type: string
          format: uuid
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/OrderTransition'
    OrderTransition:
      type: object
      additionalProperties: false
      required: [transitionId, sequenceNumber, status, occurredAt]
      properties:
        transitionId:
          type: string
          format: uuid
        sequenceNumber:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/OrderStatus'
        occurredAt:
          type: string
          format: date-time
    OrderStatus:
      type: string
      enum: [INVENTORY_PENDING, PAYMENT_PENDING, CANCELLATION_PENDING, CONFIRMED, CANCELLED]
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
